<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RegretLens{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Roboto, Arial, sans-serif;
            background: #f9f9f9;
            color: #030303;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: #fff;
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 100;
            border-bottom: 1px solid #e5e5e5;
        }

        header h1 {
            font-size: 18px;
            font-weight: 500;
            color: #030303;
            margin-left: 24px;
        }

        nav {
            position: fixed;
            top: 56px;
            left: 0;
            width: 240px;
            height: calc(100vh - 56px);
            background: #fff;
            padding: 12px 0;
            overflow-y: auto;
            border-right: 1px solid #e5e5e5;
        }

        nav a {
            display: flex;
            align-items: center;
            padding: 10px 24px;
            color: #030303;
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            transition: background 0.15s;
        }

        nav a:hover {
            background: #f2f2f2;
        }

        nav a.active {
            background: #f2f2f2;
            font-weight: 500;
        }

        .container {
            margin-left: 240px;
            margin-top: 56px;
            padding: 24px;
            max-width: 1280px;
        }

        .content {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .btn {
            background: #065fd4;
            color: #fff;
            border: none;
            border-radius: 18px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.1s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn:hover {
            background: #0556c4;
        }

        .btn-secondary {
            background: #f2f2f2;
            color: #030303;
            border: 1px solid #ccc;
            border-radius: 18px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.1s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-secondary:hover {
            background: #e5e5e5;
        }

        form {
            max-width: 100%;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #030303;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="time"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 2px;
            color: #030303;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #065fd4;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        h2 {
            font-size: 24px;
            font-weight: 400;
            color: #030303;
            margin-bottom: 16px;
        }

        h3 {
            font-size: 18px;
            font-weight: 500;
            color: #030303;
            margin-bottom: 12px;
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #ccc;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #065fd4;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #065fd4;
            cursor: pointer;
            border: none;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #065fd4;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            margin-bottom: 16px;
        }

        .chip {
            display: inline-block;
            padding: 4px 12px;
            background: #f2f2f2;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            color: #606060;
        }

        @media (max-width: 768px) {
            nav {
                display: none;
            }
            .container {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>RegretLens</h1>
    </header>

    <nav>
        <a href="{{ url_for('index') }}">ホーム</a>
        <a href="{{ url_for('new_decision') }}">新規記録</a>
        <a href="{{ url_for('feedbacks_list') }}">振り返り一覧</a>
    </nav>

    <div class="container">
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
